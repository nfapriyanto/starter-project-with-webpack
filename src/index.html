<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d97706" />
    <meta name="description" content="Share and explore stories from Dicoding community members" />

    <title>StoryApp</title>

    <link rel="shortcut icon" href="favicon.png" />
    <link rel="apple-touch-icon" href="images/icons/icon-192x192.png" />
    <link rel="manifest" href="app.webmanifest" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />

    <!-- Font Awesome 5.15.4 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- MapTiler SDK -->
    <script src="https://cdn.maptiler.com/maptiler-sdk-js/v1.7.0/maptiler-sdk.umd.js"></script>
    <link href="https://cdn.maptiler.com/maptiler-sdk-js/v1.7.0/maptiler-sdk.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <button id="skip-link" class="skip-link">Menuju konten utama</button>

      <div class="header-content container">
        <a class="brand-name__link" href="#/">
          <img class="brand-name__link__image" src="images/logo.png" alt="StoryApp Logo" />
          <span class="brand-name__link__text">StoryApp</span>
        </a>

        <nav id="navigation-drawer" class="navigation-drawer">
          <ul id="navlist-main" class="navigation-drawer__navlist-main"></ul>
          <ul id="navlist" class="navigation-drawer__navlist"></ul>
        </nav>

        <button id="drawer-button" class="drawer-button">☰</button>
      </div>
    </header>

    <main tabIndex="-1" id="main-content" class="main-content"></main>

    <footer>
      <div class="container">
        <hr />
        <div class="footer-content">
          <a class="brand-name__link" href="#/">
            <img class="brand-name__link__image" src="images/logo.png" alt="StoryApp Logo" />
            <span class="brand-name__link__text">StoryApp</span>
          </a>
          <p class="copyright">&copy; 2025 Dicoding. All rights reserved.</p>
        </div>
      </div>
    </footer>
    
    <!-- Offline fallback page -->
    <script>
      // Check if the browser supports service workers
      if ('serviceWorker' in navigator) {
        // Add offline fallback page
        window.addEventListener('load', () => {
          // Register the service worker
          if (navigator.onLine) {
            // Only show offline notification when going offline
            window.addEventListener('offline', () => {
              alert('You are currently offline. Some features may be limited.');
            });
          } else {
            // Show notification if already offline when loading
            alert('You are currently offline. Some features may be limited.');
          }
        });
      }
    </script>
  </body>
</html>
